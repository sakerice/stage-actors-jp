# 数値の取り直しだけを行う最後の保険。
#
# 本来の週次更新は Claude のルーチン（金 10:00 JST / 土 11:00 JST）が担当する。
# そちらは名簿そのもののメンテナンス（フォロワー数の目視取得、アカウント有無の確認、
# 事務所の移籍、名簿への人物追加）まで行うが、Mac が閉じていると動かない。
# このワークフローはクラウドで動くので、ルーチンが数日回らなかったときに
# 「せめて数字だけは腐らせない」ために存在する。判断が要る更新はしない。
name: ランキング数値更新（保険）

on:
  schedule:
    # 毎週日曜 12:00 JST（= 日 03:00 UTC）。48時間以内に更新済みならスキップする。
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: ranking-update
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 実行要否を判定（Claude ルーチンが動いていればスキップ）
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "手動実行なので無条件に実行する"
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            node scripts/should-run.mjs --max-age-hours 48
          fi

      - name: データ収集
        if: steps.gate.outputs.run == 'true'
        run: node scripts/update-ranking.mjs

      - name: 収集結果を検証
        if: steps.gate.outputs.run == 'true'
        run: node scripts/verify-ranking.mjs

      - name: 差分をコミット
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- data/ranking.json; then
            echo "内容に変化なし。コミットしない。"
            exit 0
          fi
          git add data/ranking.json
          git commit \
            -m "chore(data): 数値のみ自動更新（保険枠 $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M JST')）" \
            -m "Claude のルーチンが48時間以上動いていなかったため、数値だけ取り直した。名簿（roster.json）のメンテナンスは行っていない。"
          git pull --rebase origin main
          git push
