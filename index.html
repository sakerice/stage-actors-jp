<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>日本の商業舞台俳優 評価ランキング</title>
  <meta name="description" content="X・Instagram のフォロワー数、ステージナタリーでの報道量、直近の活動量から算出した日本の商業舞台俳優の総合ランキング。毎週金曜に自動更新。" />
  <style>
    :root {
      --bg: #0f1115;
      --panel: #181c24;
      --panel-2: #1e2430;
      --field: #121722;
      --text: #e8eaef;
      --muted: #9aa3b2;
      --border: #2a3140;
      --accent: #7dd3fc;
      --active: #8b5cf6;
      --warn: #fbbf24;
    }
    * { box-sizing: border-box; }
    html { color-scheme: dark; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Hiragino Sans", "Noto Sans JP", "Yu Gothic", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 20% -10%, #1a2740 0%, var(--bg) 55%);
      background-attachment: fixed;
      color: var(--text);
      font-size: 14px;
      line-height: 1.5;
      line-break: strict;
      word-break: normal;
      overflow-wrap: anywhere;
    }
    header, main, footer { max-width: 100%; margin: 0 auto; padding-inline: 1rem; }
    header { padding-top: 1.25rem; }
    h1 { margin: 0; font-size: clamp(1.2rem, 3.5vw, 1.65rem); font-weight: 600; line-height: 1.35; }
    .lede { color: var(--muted); margin: .5rem 0 0; font-size: .9rem; line-height: 1.7; max-width: 56rem; }
    .lede strong { color: var(--text); font-weight: 600; }

    .meta {
      margin-top: .75rem;
      font-size: .8rem;
      color: var(--muted);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: .75rem;
      background: var(--panel);
      max-width: 56rem;
      line-height: 1.7;
    }
    .meta b { color: var(--accent); font-weight: 600; }
    .meta ul { margin: .5rem 0 0; padding-left: 1.1rem; }
    .meta li { margin-bottom: .15rem; }
    .meta a { color: var(--accent); }

    details.formula { margin-top: .75rem; max-width: 56rem; }
    details.formula > summary {
      cursor: pointer; color: var(--accent); font-size: .8rem; padding: .25rem 0;
    }
    .formula-body {
      border: 1px solid var(--border); border-radius: 8px; background: var(--panel);
      padding: .75rem; font-size: .8rem; color: var(--muted); line-height: 1.7; margin-top: .25rem;
    }
    .formula-body table { width: auto; font-size: .78rem; margin-top: .5rem; }
    .formula-body th, .formula-body td { padding: .25rem .6rem .25rem 0; border: none; }

    .filters {
      margin-top: 1rem;
      padding: .85rem;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 10px;
      display: grid;
      gap: .75rem;
    }
    .filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem .75rem; }
    .filter-row label, .filter-label { color: var(--muted); font-size: .8rem; white-space: nowrap; }
    .chips { display: flex; flex-wrap: wrap; gap: .35rem; }
    .chip {
      background: #222836;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      padding: .28rem .6rem;
      font-size: .75rem;
      cursor: pointer;
      line-height: 1.4;
    }
    .chip.on { background: #2d2450; border-color: var(--active); color: #ddd6fe; }
    .linkish {
      font-size: .75rem; color: var(--accent); background: none; border: none;
      cursor: pointer; text-decoration: underline; padding: 0 .25rem;
    }
    .search, .agency-select {
      background: var(--field);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      padding: .45rem .65rem;
      font-size: .85rem;
      line-height: 1.5;
      min-width: 12rem;
      max-width: 100%;
    }
    .count { font-size: .78rem; color: var(--muted); margin-left: auto; }

    .table-wrap {
      margin: 1rem 0 1.5rem;
      overflow-x: auto;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--panel);
    }
    table { width: max-content; min-width: 100%; border-collapse: collapse; font-size: .82rem; }
    th, td { border-bottom: 1px solid var(--border); padding: .5rem .55rem; text-align: left; vertical-align: top; line-height: 1.5; }
    th {
      position: sticky; top: 0; background: var(--panel-2); color: #c8d0dc;
      font-weight: 600; white-space: nowrap; z-index: 1;
    }
    th.sortable { cursor: pointer; user-select: none; }
    th.sortable:hover { color: var(--accent); }
    th .dir { color: var(--accent); font-size: .7rem; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(125, 211, 252, .06); }
    .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .rank-cell { text-align: right; font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 600; white-space: nowrap; }
    .name-cell { font-weight: 600; white-space: nowrap; }
    .name-cell .yomi { display: block; font-weight: 400; font-size: .7rem; color: var(--muted); }
    .muted { color: var(--muted); }
    .tags-cell { max-width: 11rem; }
    .tag {
      display: inline-block; font-size: .68rem; padding: .12rem .4rem; margin: 0 .2rem .2rem 0;
      border-radius: 999px; background: #232a39; border: 1px solid var(--border); color: #c6cfde; line-height: 1.4;
    }
    .badge {
      display: inline-block; font-size: .66rem; padding: 0 .3rem; margin-left: .3rem;
      border-radius: 4px; border: 1px solid var(--warn); color: var(--warn); line-height: 1.5;
    }
    .score-cell { min-width: 6.5rem; }
    .score-val { font-variant-numeric: tabular-nums; font-weight: 600; }
    .bar { height: 4px; border-radius: 2px; background: #232a39; margin-top: .25rem; overflow: hidden; }
    .coverage { display: block; font-size: .66rem; color: var(--muted); margin-top: .2rem; }
    .coverage.low { color: var(--warn); }
    .sub { display: block; font-size: .66rem; color: var(--muted); }
    .bar > i { display: block; height: 100%; background: var(--accent); }
    .news-cell { max-width: 20rem; }
    .news-cell .date { color: var(--muted); font-size: .72rem; }
    .works-cell { max-width: 17rem; font-size: .76rem; color: #c6cfde; }
    a.link { color: var(--accent); text-decoration: none; white-space: nowrap; }
    a.link:hover { text-decoration: underline; }
    .empty { padding: 1.5rem; color: var(--muted); text-align: center; }
    footer { color: var(--muted); font-size: .78rem; padding-bottom: 2rem; max-width: 56rem; line-height: 1.8; }
    footer a { color: var(--accent); }

    @media (max-width: 720px) {
      .filter-row { flex-direction: column; align-items: stretch; }
      .count { margin-left: 0; }
      .search, .agency-select { min-width: 0; width: 100%; }
    }
  </style>
</head>
<body>
  <header>
    <h1>日本の商業舞台俳優 評価ランキング</h1>
    <p class="lede">
      ミュージカル・ストレートプレイ・2.5次元舞台・宝塚OG・歌舞伎まで、商業舞台を主戦場とする俳優を
      <strong>Web 上で公開されている情報だけ</strong>から評価して並べています。
      評価軸は <strong>X フォロワー数 / Instagram フォロワー数 / X 投稿頻度 / ニュースに取り上げられた度合い / 直近の活動量</strong> の 5 つ。
      <strong>芸歴と年齢はスコアに含めず、参考値として表示</strong>しています。
    </p>
    <div class="meta" id="meta">読み込み中…</div>

    <details class="formula">
      <summary>スコアの出し方と、各データの出どころ</summary>
      <div class="formula-body" id="formula"></div>
    </details>
  </header>

  <main>
    <section class="filters" aria-label="絞り込み">
      <div class="filter-row">
        <span class="filter-label">ジャンル（複数選択可・いずれかに該当）</span>
        <button type="button" class="linkish" id="clearAll">条件をクリア</button>
      </div>
      <div class="chips" id="genreChips"></div>
      <div class="filter-row">
        <label for="minCoverage">計測できた軸</label>
        <select id="minCoverage" class="agency-select" style="min-width:9rem" aria-label="計測できた評価軸の数で絞り込み">
          <option value="0">すべて表示</option>
          <option value="3">3 軸以上だけ</option>
          <option value="4">4 軸以上だけ</option>
        </select>
        <label for="agencySelect">事務所</label>
        <select id="agencySelect" class="agency-select" aria-label="事務所で絞り込み"></select>
        <label for="search">キーワード</label>
        <input id="search" class="search" type="search" placeholder="名前・よみ・事務所・出演作・ニュース見出し" />
        <span class="count" id="count"></span>
      </div>
    </section>

    <div class="table-wrap">
      <table>
        <thead>
          <tr id="headRow"></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div id="empty" class="empty" hidden>該当する行がありません。条件を変えてください。</div>
    </div>
  </main>

  <footer id="footer"></footer>

  <script>
    "use strict";

    var COLUMNS = [
      { key: "rank",          label: "順位",              sort: null,             cls: "rank-cell" },
      { key: "score",         label: "総合スコア",         sort: "score",          cls: "score-cell" },
      { key: "genres",        label: "ジャンル",           sort: null,             cls: "tags-cell" },
      { key: "name",          label: "名前",              sort: null,             cls: "name-cell" },
      { key: "agency",        label: "事務所",            sort: null,             cls: "" },
      { key: "xFollowers",    label: "X フォロワー",       sort: "xFollowers",     cls: "num" },
      { key: "igFollowers",   label: "IG フォロワー",      sort: "igFollowers",    cls: "num" },
      { key: "xPostFrequency",label: "X 投稿頻度",         sort: null,             cls: "" },
      { key: "news12m",       label: "報道（12ヶ月）",      sort: "news12m",        cls: "num" },
      { key: "news90d",       label: "直近90日",           sort: "news90d",        cls: "num" },
      { key: "latestNews",    label: "最新ニュース",        sort: null,             cls: "news-cell" },
      { key: "stages12m",     label: "公演（12ヶ月）",      sort: "stages12m",      cls: "num" },
      { key: "stages",        label: "出演公演",            sort: null,             cls: "works-cell" },
      { key: "age",           label: "年齢（参考）",        sort: "age",            cls: "num" },
      { key: "career",        label: "芸歴（参考）",        sort: "careerYears",    cls: "num" },
      { key: "links",         label: "リンク",             sort: null,             cls: "" }
    ];

    var AXIS_LABEL = {
      xFollowers: "X フォロワー数",
      igFollowers: "Instagram フォロワー数",
      xPostFrequency: "X 投稿頻度",
      newsCoverage: "ニュースに取り上げられた度合い",
      recentActivity: "直近の活動量"
    };

    var state = {
      data: null,
      genres: new Set(),
      agency: "",
      minCoverage: 0,
      query: "",
      sortKey: null,
      sortDir: -1
    };

    function el(tag, cls, text) {
      var n = document.createElement(tag);
      if (cls) n.className = cls;
      if (text != null) n.textContent = text;
      return n;
    }

    function fmtInt(n) {
      return n == null ? null : n.toLocaleString("ja-JP");
    }

    function td(text, cls) {
      var c = el("td", cls || "");
      c.textContent = text == null || text === "" ? "—" : String(text);
      if (text == null || text === "") c.classList.add("muted");
      return c;
    }

    /* ---------------- スコアの説明 ---------------- */

    function renderFormula(d) {
      var root = document.getElementById("formula");
      root.textContent = "";

      root.appendChild(el("p", null,
        "5 つの評価軸をそれぞれ 0〜1 に正規化し、下の重みで足し合わせて 100 点満点にしています。" +
        "フォロワー数は桁の差が大きいため対数をとってから正規化します。" +
        "計測できなかった軸がある人は、その軸の重みを残りの軸へ按分するので、データ欠損だけで不利になりません（どの軸で測れたかは各行のスコアにカーソルを合わせると出ます）。"));

      var t = el("table");
      Object.keys(d.weights).forEach(function (k) {
        var tr = el("tr");
        tr.appendChild(el("th", null, AXIS_LABEL[k] || k));
        tr.appendChild(el("td", "num", Math.round(d.weights[k] * 100) + "%"));
        tr.appendChild(el("td", "muted", axisNote(k)));
        t.appendChild(tr);
      });
      root.appendChild(t);

      root.appendChild(el("p", null, "芸歴（デビュー年からの年数）と年齢はスコアに入れていません。表では参考値として表示するだけです。"));

      var ul = el("ul");
      d.sources.forEach(function (s) {
        var li = el("li");
        var a = el("a", null, s.name);
        a.href = s.url;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        li.appendChild(a);
        li.appendChild(document.createTextNode(" — " + s.use + (s.asOf ? "（集計日 " + s.asOf + "）" : "")));
        ul.appendChild(li);
      });
      root.appendChild(el("p", null, "データの出どころ:"));
      root.appendChild(ul);
    }

    function axisNote(k) {
      switch (k) {
        case "xFollowers": return "本人または公式運営アカウントのフォロワー数（対数）";
        case "igFollowers": return "同上（対数）";
        case "xPostFrequency": return "X の API が有料化され自動取得できないため、名簿側の手入力欄。未記入なら重みを按分";
        case "newsCoverage": return "直近12ヶ月のステージナタリー掲載記事数と、その記事の注目度の合成";
        case "recentActivity": return "直近90日の記事数、最新記事の新しさ、直近12ヶ月に上演があった公演数の合成";
        default: return "";
      }
    }

    /* ---------------- フィルタ ---------------- */

    function renderGenreChips() {
      var root = document.getElementById("genreChips");
      root.textContent = "";
      state.data.genres.forEach(function (g) {
        var b = el("button", "chip" + (state.genres.has(g) ? " on" : ""), g);
        b.type = "button";
        b.setAttribute("aria-pressed", state.genres.has(g) ? "true" : "false");
        b.addEventListener("click", function () {
          if (state.genres.has(g)) state.genres.delete(g); else state.genres.add(g);
          renderGenreChips();
          renderTable();
        });
        root.appendChild(b);
      });
    }

    function fillAgencySelect() {
      var sel = document.getElementById("agencySelect");
      sel.textContent = "";
      var o0 = el("option", null, "すべて");
      o0.value = "";
      sel.appendChild(o0);
      var names = {};
      state.data.actors.forEach(function (a) { if (a.agency) names[a.agency] = true; });
      Object.keys(names).sort(function (x, y) { return x.localeCompare(y, "ja"); }).forEach(function (n) {
        var o = el("option", null, n);
        o.value = n;
        sel.appendChild(o);
      });
      sel.value = state.agency;
    }

    function haystack(a) {
      return [
        a.name, a.yomi, a.agency, (a.genres || []).join(" "),
        (a.stages || []).join(" "),
        a.latestNews && a.latestNews.title,
        (a.topNews || []).map(function (n) { return n.title; }).join(" "),
        a.profile, a.xHandle, a.igHandle, a.origin
      ].filter(Boolean).join(" ").toLowerCase();
    }

    function filtered() {
      var q = state.query.trim().toLowerCase();
      var rows = state.data.actors.filter(function (a) {
        if (state.genres.size > 0 && !(a.genres || []).some(function (g) { return state.genres.has(g); })) return false;
        if (state.agency && a.agency !== state.agency) return false;
        if (state.minCoverage && (a.coverage || 0) < state.minCoverage) return false;
        if (q && haystack(a).indexOf(q) < 0) return false;
        return true;
      });
      if (state.sortKey) {
        rows = rows.slice().sort(function (x, y) {
          var vx = x[state.sortKey], vy = y[state.sortKey];
          if (vx == null && vy == null) return 0;
          if (vx == null) return 1;      // 未計測は常に後ろ
          if (vy == null) return -1;
          return (vx - vy) * state.sortDir;
        });
      }
      return rows;
    }

    /* ---------------- 表 ---------------- */

    function renderHead() {
      var tr = document.getElementById("headRow");
      tr.textContent = "";
      COLUMNS.forEach(function (c) {
        var th = el("th", c.sort ? "sortable" : null);
        th.appendChild(document.createTextNode(c.label));
        if (c.sort) {
          th.title = "クリックで並べ替え";
          if (state.sortKey === c.sort) {
            th.appendChild(el("span", "dir", state.sortDir < 0 ? " ▼" : " ▲"));
          }
          th.addEventListener("click", function () {
            if (state.sortKey === c.sort) state.sortDir = -state.sortDir;
            else { state.sortKey = c.sort; state.sortDir = -1; }
            renderHead();
            renderTable();
          });
        }
        tr.appendChild(th);
      });
    }

    var STATE_TEXT = {
      none: "アカウントなし",
      unmeasured: "未計測",
      unknown: "未確認"
    };
    var STATE_HINT = {
      none: "本人名義のアカウントが無いことを確認済み。スコアでは 0 として扱っています。",
      unmeasured: "アカウントは確認できましたが、集計サイトに数値がなく取得できませんでした。この軸は除外し、重みを他の軸へ按分しています。",
      unknown: "本人名義のアカウントの有無自体を確認できていません。この軸は除外し、重みを他の軸へ按分しています。"
    };

    function followerCell(value, state, source, handle, urlBase, note) {
      var c = el("td", "num");
      if (value == null) {
        c.classList.add("muted");
        c.appendChild(document.createTextNode(STATE_TEXT[state] || "—"));
        c.title = STATE_HINT[state] || "";
        return c;
      }
      if (handle) {
        var a = el("a", "link", fmtInt(value));
        a.href = urlBase + handle;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.title = "@" + handle + (note ? "（" + note + "）" : "");
        c.appendChild(a);
      } else {
        c.appendChild(document.createTextNode(fmtInt(value)));
      }
      if (source === "manual") {
        var b = el("span", "badge", "手動");
        b.title = "自動集計に無かったため、公開プロフィールの表示値を手入力（概数）";
        c.appendChild(b);
      }
      return c;
    }

    function scoreCell(a) {
      var c = el("td", "score-cell");
      c.appendChild(el("span", "score-val", a.score != null ? a.score.toFixed(1) : "—"));
      var bar = el("div", "bar");
      var i = el("i");
      i.style.width = Math.max(0, Math.min(100, a.score || 0)) + "%";
      bar.appendChild(i);
      c.appendChild(bar);
      var n = a.coverage != null ? a.coverage : (a.measuredAxes || []).length;
      var cov = el("span", "coverage" + (n <= 2 ? " low" : ""), n + "/5 軸");
      c.appendChild(cov);
      var measured = (a.measuredAxes || []).map(function (k) { return AXIS_LABEL[k] || k; });
      c.title = "5 つの評価軸のうち " + n + " つを計測。内訳: " + (measured.length ? measured.join(" / ") : "なし") +
        (n < 5 ? "\n計測できなかった軸の重みは、この行の残りの軸へ按分しています。" : "");
      return c;
    }

    function renderTable() {
      var tbody = document.getElementById("tbody");
      var empty = document.getElementById("empty");
      tbody.textContent = "";
      var rows = filtered();
      document.getElementById("count").textContent = rows.length + " 人 / 全 " + state.data.actors.length + " 人";
      if (!rows.length) { empty.hidden = false; return; }
      empty.hidden = true;

      rows.forEach(function (a, idx) {
        var tr = el("tr");

        // 順位（絞り込み後はその中での順位。全体順位は title に出す）
        var rankTd = el("td", "rank-cell", String(idx + 1));
        rankTd.title = "全体では " + a.rank + " 位";
        tr.appendChild(rankTd);

        tr.appendChild(scoreCell(a));

        var tagsTd = el("td", "tags-cell");
        (a.genres || []).forEach(function (g) { tagsTd.appendChild(el("span", "tag", g)); });
        tr.appendChild(tagsTd);

        var nameTd = el("td", "name-cell");
        nameTd.appendChild(document.createTextNode(a.name));
        if (a.yomi) nameTd.appendChild(el("span", "yomi", a.yomi));
        if (a.profile) nameTd.title = a.profile;
        tr.appendChild(nameTd);

        tr.appendChild(td(a.agency));

        tr.appendChild(followerCell(a.xFollowers, a.xAccountState, a.xFollowersSource, a.xHandle, "https://x.com/", a.socialNote));
        tr.appendChild(followerCell(a.igFollowers, a.igAccountState, a.igFollowersSource, a.igHandle, "https://www.instagram.com/", null));

        var freqTd = el("td");
        if (a.xPostFrequency) {
          freqTd.textContent = a.xPostFrequency;
        } else {
          freqTd.classList.add("muted");
          freqTd.textContent = "未計測";
          freqTd.title = "X の API が有料化されたため自動取得できません。data/roster.json の xPostFrequency に手入力すると反映されます。";
        }
        tr.appendChild(freqTd);

        var n12 = el("td", "num");
        n12.textContent = a.news12m == null ? "—" : fmtInt(a.news12m) + " 本";
        if (a.newsAttention12m) n12.title = "記事の注目度合計 " + fmtInt(a.newsAttention12m);
        tr.appendChild(n12);

        var n90 = el("td", "num");
        n90.textContent = a.news90d == null ? "—" : fmtInt(a.news90d) + " 本";
        if (a.daysSinceNews != null) n90.title = "最新の記事は " + a.daysSinceNews + " 日前";
        tr.appendChild(n90);

        var newsTd = el("td", "news-cell");
        if (a.latestNews) {
          newsTd.appendChild(el("span", "date", a.latestNews.date + "　"));
          newsTd.appendChild(document.createTextNode(a.latestNews.title));
        } else {
          newsTd.classList.add("muted");
          newsTd.textContent = "—";
        }
        tr.appendChild(newsTd);

        var p12 = el("td", "num");
        if (a.stages12m == null) {
          p12.classList.add("muted");
          p12.textContent = "—";
        } else {
          p12.textContent = a.stages12m + " 本";
          if (a.stagesUpcoming) {
            p12.appendChild(el("span", "sub", "上演予定 " + a.stagesUpcoming));
          }
          p12.title = "直近12ヶ月に上演があった公演の本数" +
            (a.stagesUpcoming ? "。うち " + a.stagesUpcoming + " 本はこれから／上演中" : "");
        }
        tr.appendChild(p12);

        var worksTd = el("td", "works-cell");
        var list = a.stageList || (a.stages || []).map(function (t) { return { title: t }; });
        if (list.length) {
          worksTd.textContent = list.slice(0, 3).map(function (p) { return p.title; }).join(" / ");
          worksTd.title = list.map(function (p) {
            return p.start ? p.title + "（" + p.start + " 〜 " + p.end + "）" : p.title;
          }).join("\n");
        } else {
          worksTd.classList.add("muted");
          worksTd.textContent = "—";
        }
        tr.appendChild(worksTd);

        var ageTd = el("td", "num");
        ageTd.textContent = a.age != null ? a.age + " 歳" : "—";
        if (a.birth) ageTd.title = "生年月日 " + a.birth;
        if (a.age == null) ageTd.classList.add("muted");
        tr.appendChild(ageTd);

        var carTd = el("td", "num");
        carTd.textContent = a.careerYears != null ? "約 " + a.careerYears + " 年" : "—";
        if (a.debutYear) carTd.title = a.debutYear + "年デビュー";
        if (a.careerYears == null) carTd.classList.add("muted");
        tr.appendChild(carTd);

        var linkTd = el("td");
        if (a.natalieUrl) {
          var na = el("a", "link", "ナタリー");
          na.href = a.natalieUrl;
          na.target = "_blank";
          na.rel = "noopener noreferrer";
          linkTd.appendChild(na);
        }
        if (a.officialSite) {
          if (linkTd.childNodes.length) linkTd.appendChild(document.createTextNode(" / "));
          var oa = el("a", "link", "公式");
          oa.href = a.officialSite;
          oa.target = "_blank";
          oa.rel = "noopener noreferrer";
          linkTd.appendChild(oa);
        }
        if (!linkTd.childNodes.length) { linkTd.classList.add("muted"); linkTd.textContent = "—"; }
        tr.appendChild(linkTd);

        tbody.appendChild(tr);
      });
    }

    /* ---------------- 起動 ---------------- */

    function renderMeta(d) {
      var meta = document.getElementById("meta");
      meta.textContent = "";
      var p = el("p");
      p.style.margin = "0";
      p.appendChild(document.createTextNode("最終更新 "));
      p.appendChild(el("b", null, d.generatedAtJst));
      p.appendChild(document.createTextNode("（毎週金曜 10:00 に自動更新。取りこぼした場合は翌 土曜 11:00 に再実行）"));
      meta.appendChild(p);

      var c = d.counts;
      meta.appendChild(el("p", null,
        "収録 " + c.actors + " 人。うち X フォロワー数を取得できたのが " + c.withX + " 人、" +
        "Instagram が " + c.withIg + " 人、生年月日が " + c.withBirth + " 人。" +
        "数値が無い欄は「アカウントなし（確認済み・0 点として算入）」「未計測（アカウントはあるが数値を取れない）」" +
        "「未確認（アカウントの有無を確認できていない）」を区別して表示しています。"
      ));
      meta.lastChild.style.margin = ".35rem 0 0";
    }

    function renderFooter(d) {
      var f = document.getElementById("footer");
      f.textContent = "";
      f.appendChild(el("p", null,
        "このページは Wikipedia / Wikidata を使わず、公開されている一次情報と第三者集計サイトから機械的に組み立てています。" +
        "数値は各ソースの公表値をそのまま引いたもので、独自に推定した値は含みません。"
      ));
      var ul = el("ul");
      d.sources.forEach(function (s) {
        var li = el("li");
        var a = el("a", null, s.name);
        a.href = s.url; a.target = "_blank"; a.rel = "noopener noreferrer";
        li.appendChild(a);
        li.appendChild(document.createTextNode("：" + s.use + (s.asOf ? "（集計日 " + s.asOf + "）" : "")));
        ul.appendChild(li);
      });
      f.appendChild(ul);
      f.appendChild(el("p", null,
        "「手動」バッジの付いた数値は、自動集計サイトに掲載が無かったため公開プロフィールの表示値を控えたものです（概数）。" +
        "ランキングは公開データに基づく機械的な集計であり、俳優の実力や評価を示すものではありません。"
      ));
    }

    function init() {
      var meta = document.getElementById("meta");
      fetch("./data/ranking.json", { cache: "no-store" })
        .then(function (r) {
          if (!r.ok) throw new Error("HTTP " + r.status);
          return r.json();
        })
        .then(function (d) {
          state.data = d;
          renderMeta(d);
          renderFormula(d);
          renderGenreChips();
          fillAgencySelect();
          renderHead();
          renderTable();
          renderFooter(d);
        })
        .catch(function (e) {
          meta.textContent = "データ（data/ranking.json）を読み込めませんでした: " + e.message;
        });

      document.getElementById("clearAll").addEventListener("click", function () {
        state.genres.clear();
        state.agency = "";
        state.minCoverage = 0;
        state.query = "";
        state.sortKey = null;
        state.sortDir = -1;
        document.getElementById("agencySelect").value = "";
        document.getElementById("minCoverage").value = "0";
        document.getElementById("search").value = "";
        renderGenreChips();
        renderHead();
        renderTable();
      });
      document.getElementById("agencySelect").addEventListener("change", function (e) {
        state.agency = e.target.value;
        renderTable();
      });
      document.getElementById("minCoverage").addEventListener("change", function (e) {
        state.minCoverage = Number(e.target.value) || 0;
        renderTable();
      });
      document.getElementById("search").addEventListener("input", function (e) {
        state.query = e.target.value;
        renderTable();
      });
    }

    init();
  </script>
</body>
</html>
